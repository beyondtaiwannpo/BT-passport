<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond Taiwan</title>
<!-- 2026-09-02（階段 7 前置）：這一頁是登入後的入口（規格 §2-1）。
     `/` 是對外簡介，`/app/` 是登入與登入後的選單，`/passport/` 只剩護照本身。

     ── 圖示與 manifest（2026-09-02 從 passport/ 搬到 shared/）──
     **manifest 的 start_url 指這一頁。** 幹部釘到主畫面的是「登入後看得到
     全部功能的那一頁」，不是護照 —— 護照現在只是選單裡的一個入口，
     時間看板也在那個選單裡。scope 是 "/"，所以四個資料夾都在範圍內。

     背景色用 #EDE5D8 不是隨便挑的 —— logo 本來就是坐在卡片的那個紙色上設計的
     （它同時有深色與淺色筆畫，換成別的底色其中一半會消失）。
     圖示四周留了 14% 的邊：iOS 會把主畫面圖示切圓角，貼邊的話 logo 會被切掉。
     apple-touch-icon 是 iOS 用的，manifest 裡的 192/512 是 Android 用的，兩邊都要。
     **所有尺寸都只用左邊的台灣圖形，不含 Beyond Taiwan 字樣。**
     兩個理由：整組橫式 logo 縮到 32px 會糊成一團認不出來；而主畫面圖示實際顯示
     大約 60pt，那個大小下「Beyond Taiwan」那行字也已經看不清了。
     圖形與文字的切點（原圖 x=160）是量出來的，不是目測：逐欄統計不透明像素，
     那裡有一段 35px 全透明的空白。
     一開始大尺寸留了整組 logo、小尺寸用圖形，後來統一成圖形 ——
     同一個 app 在不同位置長得不一樣，比哪一種好看更糟。 -->
<link rel="icon" type="image/png" sizes="32x32" href="../shared/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="../shared/favicon-48.png">
<link rel="apple-touch-icon" href="../shared/apple-touch-icon.png">
<link rel="manifest" href="../shared/site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Beyond Taiwan">
<meta name="theme-color" content="#102A86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/brand.css">

<style>
  /* 色票、字體家族、圓角全部來自 ../shared/brand.css，這裡一個都不重新宣告。

     下面這些卡片與按鈕的樣式跟 passport/index.html 裡的長得很像，
     **是各寫一份，不是共用的**——brand.css 的檔頭明文寫著不要把按鈕、卡片、
     格線搬進去，理由是那會變成一個沒有人敢動的全站樣式表。
     這兩個資料夾在階段 7 都要重做視覺，那時候才會知道有沒有真正共用的元件。 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #bt-root{
    font-family:var(--body);color:var(--ink);line-height:1.55;
    max-width:520px;margin:0 auto;padding:clamp(20px,6vw,44px) 14px 40px;
  }
  /* :where() 是必要的，不是風格。裸寫 #bt-root button 的特異性會蓋掉所有
     用 class 描述外觀的規則，.btn 的深藍底、.btn.ghost 的外框全部會失效。
     護照那邊因為這件事，畫面上所有按鈕的外觀死了一個多月都沒有人發現。
     **不要把 :where() 拿掉**（見 passport/index.html 同一條的註解）。 */
  :where(#bt-root button){font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
  #bt-root :focus-visible{outline:2px solid var(--bt-navy);outline-offset:2px}

  /* 2026-09-03（7-4）：內距與標題在手機上縮小。之前 30/28 + 36px 的 h2 在 390px
     的螢幕上，卡片有三分之一是留白與標題，表單本身被擠到第二屏。 */
  .card{background:var(--paper);border:1px solid rgba(16,42,134,.18);border-radius:var(--r);padding:clamp(22px,5vw,30px) clamp(18px,5vw,28px)}
  .card h2{font-family:var(--display);font-size:clamp(28px,7vw,34px);font-weight:700;letter-spacing:.02em;margin:0 0 4px;line-height:1.05}
  .card .sub{font-size:14px;opacity:.65;margin-bottom:20px}
  label{display:block;margin-bottom:15px}
  label i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.55;display:block;margin-bottom:5px}
  input{
    width:100%;font-family:var(--body);font-size:15px;color:var(--ink);
    padding:9px 11px;border:1px solid rgba(16,42,134,.28);border-radius:2px;
    background:rgba(255,255,255,.55);
  }
  /* ── 按鈕的輕重（2026-09-03，7-4）──
     一頁只有**一顆**實心深藍鈕，就是主要動作，滿版。
     第二選擇（Google）是滿版的框線鈕，用內文字體、不大寫、一行 ——
     之前它用 display 字體大寫加雙語標籤，折成兩行、成了整頁最大的元素，
     比主要動作還搶眼（使用者 2026-09-01 的回報；量到是 284×71 對 84×47）。
     導覽（切換登入／註冊、回登入、登出）不是按鈕，是文字連結：見 .link。
     這裡不再有 .quiet：護照那邊的 .btn.quiet 是給「清除這本護照」的安全降級，
     跟「這顆不是主要動作」不是同一件事，同名只會讓人把兩者混在一起。 */
  .btn{
    display:block;width:100%;
    font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:13px 20px;border-radius:2px;background:var(--bt-navy);color:var(--bt-cream);
    transition:opacity .15s;text-align:center;
  }
  .btn:hover{opacity:.86}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.ghost{
    background:none;color:var(--ink);border:1px solid rgba(16,42,134,.35);
    font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;
    padding:12px 16px;
  }
  .btn.sm{display:inline-block;width:auto;font-size:14px;padding:7px 14px}
  .link{background:none;border:none;padding:0;font-family:var(--body);font-size:15px;font-weight:600;
    color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .link:hover{opacity:.75}
  .stack{display:grid;gap:10px;margin-top:18px}
  .nav{margin-top:16px;font-size:15px}
  /* 說明文字：小字、無底色。**橘色框只留給錯誤與狀態訊息**（.wnote）——
     說明跟錯誤共用一種框的時候，有事的那塊框跳不出來，這一頁就沒有輕重。 */
  .note{font-size:13px;line-height:1.6;opacity:.7;margin-top:14px}
  .note b{opacity:1}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .wnote{font-size:14px;line-height:1.55;margin-bottom:18px;padding:11px 14px;background:rgba(255,196,108,.3);border-left:3px solid var(--bt-orange);border-radius:2px}
  .empty{text-align:center;padding:48px 0;opacity:.55;font-size:14px}

  /* 登入後的選單 */
  .menu{display:grid;gap:10px}
  .mitem{
    display:block;padding:16px 18px;border:1px solid rgba(16,42,134,.22);border-radius:2px;
    background:rgba(255,255,255,.4);color:var(--ink);text-decoration:none;transition:background .15s;
  }
  .mitem:hover{background:rgba(255,255,255,.75)}
  .mitem b{font-family:var(--display);font-size:23px;font-weight:600;display:block;line-height:1.15}
  .mitem span{font-size:13px;opacity:.6}
</style>
</head>
<body>
<div id="bt-root"><div class="empty">載入中…</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
