<title>Beyond Taiwan Passport</title>
<!-- 圖示：三十位幹部會把這個網站釘在手機主畫面，那個位置沒圖示會是一張白紙。
     背景色用 #EDE5D8 不是隨便挑的 —— logo 本來就是坐在卡片的那個紙色上設計的
     （它同時有深色與淺色筆畫，換成別的底色其中一半會消失）。
     圖示四周留了 14% 的邊：iOS 會把主畫面圖示切圓角，貼邊的話 logo 會被切掉。
     apple-touch-icon 是 iOS 用的，manifest 裡的 192/512 是 Android 用的，兩邊都要。
     **所有尺寸都只用左邊的台灣圖形，不含 Beyond Taiwan 字樣。**
     兩個理由：整組橫式 logo 縮到 32px 會糊成一團認不出來；而主畫面圖示實際顯示
     大約 60pt，那個大小下「Beyond Taiwan」那行字也已經看不清了。
     圖形與文字的切點（原圖 x=160）是量出來的，不是目測：逐欄統計不透明像素，
     那裡有一段 35px 全透明的空白。
     一開始大尺寸留了整組 logo、小尺寸用圖形，後來統一成圖形 ——
     同一個 app 在不同位置長得不一樣，比哪一種好看更糟。 -->

<style>
  :root{
    --bt-orange:#FFC46C;
    --bt-cream:#EDE5D8;
    --bt-navy:#102A86;
    --ink:var(--bt-navy);
    --paper:var(--bt-cream);
    --display:"Barlow Condensed", "Noto Sans TC", sans-serif;
    --body:"Inter", "Noto Sans TC", system-ui, sans-serif;
    --r:3px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #bt-root{
    font-family:var(--body);
    color:var(--ink);
    line-height:1.55;
    max-width:940px;
    margin:0 auto;
    padding:0 0 40px;
  }
  /* 這條 reset 的選擇器**必須**包在 :where() 裡。
     裸寫 #bt-root button 的特異性是 (1,0,1)，會蓋掉所有用 class 描述外觀的規則 ——
     .btn 的深藍實心底、.btn.ghost 與 .nav .arrow 的外框、.slot 的虛線框、
     .tabs 選中時的深藍底、.photo 的框、.dots 的圓框與蓋滿轉橘，一條都沒有生效過。
     這個站從原型 a2a26c2 到 2026-08-22 為止，畫面上所有按鈕的外觀都是死的，
     唯一看得見的圓點是 .dots [aria-current] 的 outline —— outline 不受 border/background 影響。
     :where() 的特異性恆為零，所以這條規則仍然蓋得過瀏覽器預設樣式
     （作者樣式表無論特異性多低都排在 UA 樣式表前面），但輸給任何一條 class 規則。
     **不要把 :where() 拿掉**，check.sh 有一條檢查在守它。見 spec 2026-08-22 §1。 */
  :where(#bt-root button){font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
  #bt-root :focus-visible{outline:2px solid var(--bt-navy);outline-offset:2px}

  /* ---------- shell ---------- */
  .bar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 18px;margin-bottom:14px;
    background:var(--paper);
    border:1px solid rgba(16,42,134,.14);
    border-radius:var(--r);
  }
  .bar img{height:26px;width:auto;display:block}
  .bar .sp{flex:1}
  .tabs{display:flex;border:1px solid rgba(16,42,134,.22);border-radius:2px;overflow:hidden}
  .tabs button{
    font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;padding:6px 14px;color:rgba(16,42,134,.55);
    transition:background .15s,color .15s;
  }
  .tabs button[aria-selected="true"]{background:var(--bt-navy);color:var(--bt-cream)}
  .prog{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1}
  .prog small{font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;display:block;opacity:.5;line-height:1;margin-bottom:4px}

  /* ---------- book ---------- */
  .book{
    background:var(--paper);
    border:1px solid rgba(16,42,134,.18);
    border-radius:var(--r);
    position:relative;overflow:hidden;
    min-height:520px;
    /* min-height 讓書維持固定高度，翻頁時大小不變、上一頁／下一頁不會移動。
       但內容比 520px 短的時候，多出來的高度會變成 nav 底下一條空白帶
       （實測：月份頁 44.7px、說明頁 134.2px）。
       改成 flex column 讓 .page 吸收那段高度、nav 貼著書的底部，
       死白就變成頁面自己的餘白，而不是書裡的一個破洞。
       **不要改成「短頁面就拿掉 min-height」** —— 那會讓書在翻到說明頁時變矮，
       上一頁／下一頁按鈕跟著往上跳。會動的東西比死白更糟。 */
    display:flex;flex-direction:column;
  }
  .book::before{ /* 裝訂線 */
    content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
    /* 等距的米白圓點打在深藍上，讀起來像縫線的針孔。
       圓點用 var(--paper) 實色不用 rgba 的米白：check.sh 的 §11-14 只允許三個
       rgba 底色（16,42,134 / 255,196,108 / 255,255,255），米白 237,229,216 那個
       rgba 底色不在允許清單裡，寫了會被擋。
       半徑 1.6px、間距 22px 是配著 9px 的書脊寬挑的 —— 點再大就變成虛線，
       再密就糊成一條淺色帶，兩者都不像針孔。
       opacity 從 .9 拿掉改成 1：原本那條是用來讓深藍不要太實，但現在上面有圓點，
       整條再壓一次會讓圓點也跟著糊掉。深藍本身的份量改用漸層那層的實色控制。 */
    background:
      radial-gradient(circle at 50% 50%, var(--paper) 1.6px, transparent 1.7px) 0 0 / 9px 22px repeat-y,
      var(--bt-navy);
  }
  .book::after{ /* guilloche：120x40 貼片、每片兩排、四條干涉正弦波，2026-08-23 定案 */
    /* stroke 用 rgba(16,42,134,0.035) 不用 #102A86 + stroke-opacity：
       2026-08-23 實測三種寫法——未編碼的 # 會被瀏覽器當成 data URI 的 fragment，
       圖直接不載入（onerror）；URL 編碼過的色碼能載入，但 check.sh 的 §11-14 hex
       掃描看不到它，等於這段紋路悄悄脫離三色檢查；rgba(16,42,134,...) 能載入，
       而且本來就是 check.sh 允許的三個 rgba 底色之一，三色檢查涵蓋得到。所以不要
       「順手」改回 #102A86 加 stroke-opacity 或改成 URL 編碼，那樣會讓這段紋路
       脫離守備範圍。 */
    /* 調這組參數之前，先把 stroke 的 alpha 臨時改成 0.07 檢查接縫與帶狀感，
       確認乾淨了再改回 0.035——低對比會把接縫缺陷藏起來。第一版每條波只畫在
       貼片中間、帶與帶之間留空隙，重複之後讀成橫條紋，在 3.5% 下完全看不出來，
       拉到 7% 一眼就看到；修法是讓每條波在 cy、cy-H、cy+H 各畫一次跨過上下邊界，
       每片再排兩排、相位錯開。 */

  .page{padding:26px 26px 46px 34px;position:relative;z-index:1;flex:1}
  .page.turn{animation:turn .34s ease}
  @keyframes turn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

  /* 每頁右下角的頁碼。位置絕對定位在 .page 的右下，所以它跟著紙走、不是釘在書上。
     字級 12px、字距拉開、透明度 .35 —— 它是給人確認「翻到哪了」的，不是要被讀的。
     tabular-nums 讓 01 到 13 的數字寬度一致，翻頁時不會左右跳動。
     字體不用指定：.pageno 繼承 #bt-root 的 var(--body) 不對，這裡要 var(--display)
     跟月份數字同一套，所以明寫。 */
  .pageno{
    position:absolute;right:26px;bottom:26px;
    font-family:var(--display);font-size:12px;font-weight:600;
    letter-spacing:.22em;text-transform:uppercase;
    color:rgba(16,42,134,.35);font-variant-numeric:tabular-nums;
    pointer-events:none;
  }

  .nav{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px 10px 34px;border-top:1px solid rgba(16,42,134,.14);
    position:relative;z-index:1;
  }
  .nav button.arrow{
    font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.06em;
    padding:6px 12px;border:1px solid rgba(16,42,134,.25);border-radius:2px;
  }
  .nav button.arrow:disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
  .dots button{width:9px;height:9px;border-radius:50%;border:1px solid rgba(16,42,134,.4)}
  .dots button[data-on="1"]{background:var(--bt-orange);border-color:var(--bt-orange)}
  .dots button[aria-current="true"]{outline:2px solid var(--bt-navy);outline-offset:2px}

  /* ---------- month page ---------- */
  .mhead{display:flex;align-items:flex-end;gap:16px;border-bottom:2px solid var(--bt-navy);padding-bottom:10px;margin-bottom:22px}
  .mnum{font-family:var(--display);font-size:76px;font-weight:700;line-height:.78;letter-spacing:-.02em}
  .mzh{font-family:var(--display);font-size:30px;font-weight:600;line-height:1;margin-bottom:2px}
  /* 說明頁沒有月份數字：那一頁不是月份，00 又已經給了資料頁，硬塞一個符號進去
     只會讓人多看一眼想「這是第幾頁」。少了左邊 76px 的數字，.mhead 的重心會偏，
     所以改用把標題推到數字那一級來補 —— 52px 跟月份頁「09 九月」的視覺重量對得上。
     **只能掛在 .mhead.solo 上。** 直接改 .mzh 的話，月份頁的「九月」與資料頁的
     「持照人資料」會一起變 52px，兩頁的版面都會爆。 */
  .mhead.solo .mzh{font-size:52px;margin-bottom:0}
  .mtheme{margin-left:auto;text-align:right;line-height:1.25}
  .mtheme b{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:.04em;display:block}
  .mtheme span{font-size:10px;font-weight:600;letter-spacing:.2em;opacity:.55;text-transform:uppercase}
  /* 月份頁的右上角放時間數字（07:00），要比主題字大一級才撐得起那個位置，
     並用 tabular-nums 讓每一頁的冒號對齊。字體不用指定：.mtheme b 本來就是
     var(--display)，也就是 Barlow Condensed，跟左邊 76px 的月份數字同一套。
     **不可以直接改 .mtheme b** —— 資料頁的右上角共用同一個元件，
     那裡放的是「BEYOND TAIWAN / Passport · 2026」，跟著變 34px 會撐爆版面。 */
  .mtheme.clock b{font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.02em}

  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .slot{
    border:1.5px dashed rgba(16,42,134,.3);border-radius:var(--r);
    min-height:270px;padding:14px;
    display:flex;flex-direction:column;text-align:left;width:100%;
    transition:border-color .16s,background .16s;
    position:relative;
  }
  .slot:hover,.slot:focus-visible{border-color:var(--bt-navy);background:rgba(255,196,108,.14)}
  .slot .cat{font-size:9px;font-weight:700;letter-spacing:.2em;opacity:.5;text-transform:uppercase}
  .slot .ttl{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1;margin:5px 0 3px}
  .slot .en{font-size:10px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;opacity:.45}
  .slot .hint{font-size:12.5px;opacity:.62;margin-top:9px}
  .slot .cta{
    margin-top:auto;font-family:var(--display);font-size:15px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;opacity:.35;
  }
  .slot:hover .cta{opacity:.85}
  .slot[data-done="1"]{border-style:solid;border-color:rgba(16,42,134,.18);background:rgba(255,196,108,.1)}
  /* 蓋章之後說明留著但淡化，讓標題與章之間的內容連續、不留一片空白（2026-08-23 Task 10）。 */
  .slot[data-done="1"] .hint{opacity:.42}

  /* 說明頁的三張卡不要固定高度，讓它跟著文案長。
     .slot 的 min-height:270px 是給月份頁的活動格子用的 —— 蓋章前要先留出章的位置，
     所以那邊必須維持。說明頁沒有章，固定高度只會在文案短的時候留一大片空白，
     手機上尤其明顯（一頁只放得下一張半的卡）。
     **不需要也不要加 align-items:stretch**：.slots 是 grid，同一列的項目預設就是拉伸，
     三張卡本來就等高。多寫一條沒有作用的宣告，只會讓下一個人以為它在做事。 */
  .slots.guide .slot{min-height:0}

  /* 說明頁三張卡的標題固定兩行高。三段文案刻意都以「一個月一次／一題／一張」開頭，
     要的就是並排時第一句對齊；而「一個寫的題目，只有自己看得到」在 22px 下
     251px 放不下、會折成兩行，把那張卡的說明往下推 24.2px（實測），
     三張的第一句就錯開了。給標題固定兩行高，說明才會從同一條線開始。
     2.2em 不是隨便挑的：.slot .ttl 的 line-height 是 1.1，兩行正好 2.2em，
     em 對的是元素自己的 font-size，所以字級改了它也跟著對。
     代價是聚會與鏡頭的標題下面各多一行空白 —— 那是對齊的代價，是刻意的。
     **月份頁的 .ttl 不要跟著改**：那裡放的是活動名稱，長度本來就不一，
     而且下面接的是說明與章，沒有要對齊的東西。 */
  .slots.guide .slot .ttl{min-height:2.2em}

  /* ---------- the stamp ---------- */
  .stampwrap{margin:14px 0 0;display:flex;justify-content:center;padding:6px 0 2px}
  .tilt{transform-origin:center}
  .stamp{
    border:2.5px solid currentColor;border-radius:7px;
    padding:7px 11px 5px;text-align:center;
    opacity:.86;filter:url(#bt-ink);
    position:relative;
  }
  .stamp::after{
    content:"";position:absolute;inset:3px;border:1px solid currentColor;border-radius:4px;opacity:.55;
  }
  .stamp .s1{font-size:7.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase}
  .stamp .s2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;line-height:1.05;margin:1px 0;text-transform:uppercase}
  .stamp .s3{font-size:9.5px;font-weight:600;letter-spacing:.14em;font-variant-numeric:tabular-nums}
  /* 聚會章：橘底 + 深藍文字與框線（spec §3.1）。原型的 .ink-orange 用了
     不在三色名單裡的第四色，已移除；.stamp 既有的 opacity:.86 在有底色時
     會讓橘底透出紙面，讀起來仍像墨，保留不動。 */
  .stamp.ink-fill{
    color:var(--bt-navy);
    background:var(--bt-orange);
  }
  .ink-navy{color:var(--bt-navy)}
  .stamp.land{animation:land .42s cubic-bezier(.2,1.5,.4,1)}
  @keyframes land{
    0%{transform:scale(2.5) rotate(-14deg);opacity:0}
    55%{transform:scale(.93) rotate(2deg);opacity:.95}
    100%{opacity:.86}
  }
  /* top:60px 是量出來的，不是目測。疊印**刻意**壓住右上角的時刻
     （.mtheme.clock）——那是使用者的裁定：真的入境章也會壓到頁碼和邊框，
     章壓過底下的東西是章該有的樣子，不要「修掉」。
     但它**不可以**切到活動格子裡的任何東西。原本 top:70px 時會切掉
     九月三格全蓋滿時第三格（鏡頭 FRAME）分類標籤 .cat 的上半
     （1280px 實測重疊 251.0×5.2px），所以改成 60px，讓分類標籤下方多出 4.8px 餘裕。
     之後如果調整 .mhead 的高度、.slot 的 padding 或 .cat 的字級，
     **要回來重量這個距離**——它是兩個獨立絕對定位/旋轉元素的幾何關係，
     沒有任何測試守得住。 */
  .overprint{
    position:absolute;top:60px;right:26px;z-index:2;pointer-events:none;
    transform:rotate(-11deg);
    color:var(--bt-navy);background:var(--bt-orange);
    opacity:.85;
    border:3px double currentColor;border-radius:4px;padding:3px 13px;
    font-family:var(--display);font-size:21px;font-weight:700;letter-spacing:.2em;
    filter:url(#bt-ink);
  }
  .overprint.land{animation:land .5s cubic-bezier(.2,1.5,.4,1)}
  .slot .note{font-size:12.5px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(16,42,134,.15);opacity:.8}
  .thumb{width:100%;height:82px;object-fit:cover;border-radius:2px;margin-top:9px;display:block;
    border:1px solid rgba(16,42,134,.2)}

  /* ---------- ID page ---------- */
  .idgrid{display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start}
  .photo{
    width:150px;height:190px;border:1px solid rgba(16,42,134,.35);border-radius:2px;
    background:rgba(255,196,108,.2);display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .photo img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.15) contrast(1.05)}
  .photo span{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.5;text-align:center;padding:0 10px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
  .f{border-bottom:1px solid rgba(16,42,134,.18);padding-bottom:5px}
  .f i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.5;display:block}
  .f b{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.03em;line-height:1.2;display:block}
  .f.wide{grid-column:1/-1}
  .mrz{
    margin-top:24px;padding:12px 14px;background:rgba(16,42,134,.05);
    border-top:1px solid rgba(16,42,134,.25);border-radius:2px;
    font-size:13px;font-weight:600;letter-spacing:.13em;font-variant-numeric:tabular-nums;
    word-break:break-all;opacity:.75;line-height:1.9;
  }
  .motto{font-family:var(--display);font-size:24px;font-weight:500;line-height:1.35;
    margin-top:22px;padding-left:14px;border-left:3px solid var(--bt-orange)}

  /* ---------- wall ---------- */
  .wall{background:var(--paper);border:1px solid rgba(16,42,134,.18);border-radius:var(--r);padding:24px 26px}
  .wnote{font-size:12px;opacity:.6;margin-bottom:20px;padding:9px 12px;background:rgba(255,196,108,.25);border-radius:2px}
  .people{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
  .person{border:1px solid rgba(16,42,134,.16);border-radius:2px;padding:12px 14px;background:rgba(255,255,255,.35)}
  .person b{font-family:var(--display);font-size:21px;font-weight:600;display:block;line-height:1.15}
  .person .team{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.5}
  .track{display:grid;grid-template-columns:repeat(11,1fr);gap:2px;margin-top:10px}
  .track i{height:16px;background:rgba(16,42,134,.1);border-radius:1px;display:block}
  .track i[data-on="1"]{background:var(--bt-orange)}
  .person .cnt{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;margin-top:7px;opacity:.7}
  .feed{margin-top:26px;border-top:1px solid rgba(16,42,134,.15);padding-top:16px}
  .feed h3,.wall h3{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px}
  .fitem{display:flex;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dotted rgba(16,42,134,.16)}
  .fitem time{font-variant-numeric:tabular-nums;opacity:.5;flex:none;font-size:12px;font-weight:600}
  .fitem b{font-weight:600}

  /* ---------- setup / modal ---------- */
  .card{background:var(--paper);border:1px solid rgba(16,42,134,.18);border-radius:var(--r);padding:30px 28px;max-width:560px;margin:0 auto}
  .card h2{font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:.03em;margin:0 0 4px;line-height:1}
  .card .sub{font-size:13px;opacity:.6;margin-bottom:24px}
  label{display:block;margin-bottom:15px}
  label i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.55;display:block;margin-bottom:5px}
  input,select,textarea{
    width:100%;font-family:var(--body);font-size:15px;color:var(--ink);
    padding:9px 11px;border:1px solid rgba(16,42,134,.28);border-radius:2px;
    background:rgba(255,255,255,.55);
  }
  textarea{resize:vertical;min-height:64px}
  .btn{
    font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    padding:11px 22px;border-radius:2px;background:var(--bt-navy);color:var(--bt-cream);
    transition:opacity .15s;
  }
  .btn:hover{opacity:.86}
  .btn.ghost{background:none;color:var(--ink);border:1px solid rgba(16,42,134,.3)}
  .btn.sm{font-size:15px;padding:7px 14px}
  /* 「清除這本護照」會刪掉一整年的章、心得與照片，而且不可復原
     （clearAll() 真的刪 stamps 與 entries 的列）。它不該跟旁邊那三顆等重 ——
     編輯資料、匯出備份、匯入還原都是可逆的，只有這顆不是。
     拿掉外框、顏色降到 50%、用 margin-left:auto 推到那一列的最右邊，
     跟前三顆之間空出距離。目標是「找得到，但不會手滑按到」。
     **這不是視覺偏好，是安全設計** —— 視覺偏好可以被下一個人推翻，安全設計不行，
     所以 check.sh 有兩條檢查在守它。 */
  .btn.quiet{background:none;border:none;color:rgba(16,42,134,.5);margin-left:auto}
  .btn.quiet:hover{color:var(--ink)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

  .scrim{position:fixed;inset:0;background:rgba(16,42,134,.45);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:50;overflow:auto}
  .modal{background:var(--paper);border-radius:var(--r);padding:26px;max-width:440px;width:100%;
    border:1px solid rgba(16,42,134,.3);max-height:92vh;overflow:auto}
  .modal h3{font-family:var(--display);font-size:29px;font-weight:700;margin:0 0 2px;line-height:1.05}
  .modal .mt{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.5;margin-bottom:16px}
  .prev{width:100%;max-height:210px;object-fit:cover;border-radius:2px;margin-top:8px;display:block}

  .empty{text-align:center;padding:40px 10px;opacity:.55;font-size:14px}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--bt-navy);color:var(--bt-cream);padding:10px 18px;border-radius:2px;
    font-size:13px;font-weight:500;z-index:60;box-shadow:0 6px 22px rgba(16,42,134,.3);
  }

  @media (max-width:720px){
    .slots{grid-template-columns:1fr}
    .slot{min-height:0}
    .idgrid{grid-template-columns:1fr}
    .photo{width:130px;height:164px}
    .fields{grid-template-columns:1fr}
    .mnum{font-size:56px}
    /* 頁碼絕對定位在 .page 右下角，資料頁的按鈕列最右邊正好是「清除這本護照」——
       要留出頁碼那一行的空間，不然兩者會疊在一起。這裡留 40px 夠不夠要看下面
       .pageno 縮到多小的 inset，算式見那條規則的註解。 */
    .page{padding:20px 18px 40px 24px}
    /* 頁碼在手機也要跟著版面的邊界縮進來。桌機的 inset 是 26px，但這裡 .page 的
       padding 是 20/18，頁碼再用 26px 就會比其他東西多縮 8px，跟邊界節奏對不上。
       改成 18/20 之後，需要留的空間是 bottom(20) + 頁碼高度(18.59) = 38.59，
       所以上面那行的 padding-bottom 40px 剛好夠，餘裕 1.4px —— 跟桌機的
       26 + 18.59 = 44.59 對 46px 是同一個餘裕。兩邊對稱不是巧合，是同一條算式。 */
    .pageno{right:18px;bottom:20px}
    .nav{padding-left:24px}
    .mrz{font-size:10.5px;letter-spacing:.08em}
    /* 手機的疊印要縮小並上移。桌機的 21px 疊印在 390px 下橫跨 274px，
       幾乎跟整個頁面一樣寬，會壓到月份數字、月名、還有第一格的分類標籤與標題
       （實測 265.2x10.5 與 265.2x1.3）。
       縮到 13px 之後框變成 183x66，配上 top:26px 剛好落在「九月」與右上角時刻之間。
       **壓住時刻是刻意保留的**（見桌機那條規則的註解），但月名跟格子裡的東西不能碰 ——
       時刻是裝飾，月名是資訊，而手機是三十個幹部主要的使用裝置。
       改動這裡或 .mhead 的任何尺寸之後，要回來重量一次：這是幾何關係，沒有測試守得住。 */
    .overprint{font-size:13px;top:26px}
  }
  @media (prefers-reduced-motion:reduce){
    /* 三個動畫全部關掉。.overprint.land 是蓋滿 33 格時「FULL」浮水印的彈跳，
       它跟 .stamp.land 共用同一組 land keyframe，卻一直漏在這條規則外面 ——
       因為它只在集滿的那一刻出現，平常根本測不到。2026-08-18 做 §11-17
       驗收時用 CSSOM 逐條比對才抓到。新增動畫時記得回來加進這一行。 */
    .stamp.land,.page.turn,.overprint.land{animation:none}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="bt-ink">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="n" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<div id="bt-root"><div class="empty">載入護照中…</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
