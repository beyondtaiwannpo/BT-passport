<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond Taiwan</title>

<!-- 這一頁是對外的門面，不是登入頁（見 BT-Site-交接規格.md §2-1）。
     不認識 BT 的人、從搜尋或 IG 連過來的人，看到的是這一頁。
     **它不碰 auth**：不載入 supabase、不判斷登入狀態、不知道使用者是誰。
     那些全部在 /app/。右上角那顆按鈕只是一個連結。

     ── 目前是骨架（2026-08-31，階段 1）──
     文案由使用者提供，還沒給，所以本文全部是【待補文案】。
     check.sh 有一條守門會擋住【待補文案】進入 passport/，
     階段 7 這一頁的文案定稿之後要把守門的範圍擴到根目錄（守門裡有寫）。

     ── 還剩一個暫時的路徑 ──
     logo 已經收進 ./shared/logo.png（階段 2），色票與字體也走 ./shared/brand.css。
     **favicon 還指在 ./passport/**：那三個圖示是護照 PWA 的身分（跟 site.webmanifest
     綁在一起），平台自己還沒有一套。階段 7 這一頁定稿時一起處理。
     **不要為了好看先複製一份到根目錄** —— 兩份圖遲早會不一樣。

     右上角的按鈕現在連到 ./passport/，階段 7 有了 /app/ 之後改成 ./app/。
     這樣每一個階段結束時網站都是可以用的，不會有一顆連到 404 的按鈕。 -->

<meta name="description" content="Beyond Taiwan 是台灣的學生非營利組織，幫公立高中生看見海外升學的選項。">
<meta property="og:title" content="Beyond Taiwan">
<meta property="og:description" content="Beyond Taiwan 是台灣的學生非營利組織，幫公立高中生看見海外升學的選項。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://beyondtaiwannpo.com/">

<link rel="icon" type="image/png" sizes="32x32" href="./passport/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="./passport/favicon-48.png">
<link rel="apple-touch-icon" href="./passport/apple-touch-icon.png">
<meta name="theme-color" content="#102A86">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./shared/brand.css">

<style>
/* 色票與字體家族全部來自 ../shared/brand.css，這個檔案裡沒有任何寫死的色碼
   （唯一的例外是 <head> 的 theme-color，那是 meta 屬性，吃不了 var()）。
   要換色請改 brand.css，改這裡只會讓兩邊不一樣。
   硬規則：一個畫面最多 3 種顏色、最多 2 種字體，check.sh 會擋。 */
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.7 var(--body);
  -webkit-font-smoothing:antialiased}
h1,h2,.brand{font-family:var(--display);font-weight:700;letter-spacing:.01em}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px clamp(20px,5vw,64px)}
header img{height:34px;display:block}
/* logo 不可改色、拉伸、旋轉、調透明度（硬規則） */

.login{display:inline-block;background:var(--bt-orange);color:var(--bt-navy);text-decoration:none;
  font-weight:600;font-size:15px;padding:9px 20px;border-radius:999px;white-space:nowrap}
.login:hover{filter:brightness(.96)}
.login:focus-visible{outline:2px solid var(--bt-navy);outline-offset:2px}

main{max-width:760px;margin:0 auto;padding:clamp(32px,8vw,88px) clamp(20px,5vw,64px) 96px}
h1{font-size:clamp(40px,9vw,72px);line-height:1.05;margin:0 0 24px}
h2{font-size:clamp(22px,4vw,30px);margin:56px 0 12px}
p{margin:0 0 18px;max-width:62ch}
.todo{color:var(--ink);opacity:.55}

footer{padding:28px clamp(20px,5vw,64px);font-size:14px;opacity:.7}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <img src="./shared/logo.png" alt="Beyond Taiwan">
  <!-- 階段 7 改成 ./app/ -->
  <a class="login" href="./passport/">登入 / Sign in</a>
</header>

<main>
  <h1>【待補文案】</h1>
  <p class="todo">【待補文案】一段話說明 BT 是誰、在做什麼。</p>

  <h2>【待補文案】</h2>
  <p class="todo">【待補文案】</p>

  <h2>【待補文案】</h2>
  <p class="todo">【待補文案】</p>
</main>

<footer>Beyond Taiwan</footer>

</body>
</html>
