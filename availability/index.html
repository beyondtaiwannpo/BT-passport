<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BT 每週時間看板</title>
<meta name="theme-color" content="#102A86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/brand.css">
<style>
  /* 色票、字體、圓角全部來自 ../shared/brand.css，這裡一個都不重新宣告。 */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  #bt-root{font-family:var(--body);color:var(--ink);line-height:1.55;max-width:940px;margin:0 auto;padding:14px 12px 60px}
  /* :where() 是必要的，不是風格 —— 見 passport/index.html 同一條的註解。 */
  :where(#bt-root button){font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit}
  #bt-root :focus-visible{outline:2px solid var(--bt-navy);outline-offset:2px}

  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-bottom:12px;
    background:var(--paper);border:1px solid rgba(16,42,134,.14);border-radius:var(--r)}
  .bar img{height:24px;width:auto;display:block}
  .bar .sp{flex:1}
  .tabs{display:flex;border:1px solid rgba(16,42,134,.22);border-radius:2px;overflow:hidden}
  .tabs button{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;
    padding:6px 12px;color:rgba(16,42,134,.55);transition:background .15s,color .15s}
  .tabs button[aria-current]{background:var(--bt-navy);color:var(--bt-cream)}
  .weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
  .weeknav b{font-family:var(--display);font-size:18px;letter-spacing:.04em}

  .card{background:var(--paper);border:1px solid rgba(16,42,134,.18);border-radius:var(--r);padding:22px 20px}
  .card h2{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.03em;margin:0 0 4px;line-height:1.05}
  .card .sub{font-size:13px;opacity:.6;margin-bottom:18px}
  .card p{font-size:14px;margin:0 0 12px}
  label{display:block;margin-bottom:14px}
  label i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.55;display:block;margin-bottom:5px}
  input,select{width:100%;font-family:var(--body);font-size:15px;color:var(--ink);padding:8px 10px;
    border:1px solid rgba(16,42,134,.28);border-radius:2px;background:rgba(255,255,255,.55)}
  select{width:auto;min-width:96px}
  .btn{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    padding:9px 18px;border-radius:2px;background:var(--bt-navy);color:var(--bt-cream);transition:opacity .15s}
  .btn:hover{opacity:.86}
  .btn[disabled]{opacity:.4;cursor:default}
  .btn.ghost{background:none;color:var(--ink);border:1px solid rgba(16,42,134,.3)}
  .btn.sm{font-size:14px;padding:6px 12px}
  .btn.quiet{background:none;border:none;color:rgba(16,42,134,.55);text-transform:none;letter-spacing:0;
    font-family:var(--body);font-size:14px;font-weight:600;padding:2px 4px;text-decoration:underline}
  .btn.quiet:hover{color:var(--ink)}
  a.btn{text-decoration:none;display:inline-block}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .wnote{font-size:12.5px;opacity:.75;padding:9px 12px;background:rgba(255,196,108,.25);border-radius:2px}
  .wnote.big{font-size:15px;opacity:1;padding:14px 16px;margin-bottom:14px}
  .empty{text-align:center;padding:40px 0;opacity:.55;font-size:14px}
  .empty.sm{padding:14px 0}
  .mini{font-size:12.5px;opacity:.7}

  /* ---------- 格線 ---------- */
  /* 48 列 × 7 欄。**刻意顯示完整 24 小時**：藏起來的那幾列有可能正是某個人
     唯一有空的時間，而少了一個人這件事在畫面上看不出來。捲動比藏起來誠實。 */
  .gridwrap{overflow:auto;max-height:70vh;border:1px solid rgba(16,42,134,.18);border-radius:var(--r);background:var(--paper)}
  table.grid{border-collapse:collapse;width:100%;font-size:11px}
  table.grid th{position:sticky;top:0;z-index:2;background:var(--paper);font-family:var(--display);
    font-size:14px;font-weight:600;padding:6px 2px;border-bottom:1px solid rgba(16,42,134,.2)}
  table.grid th span{display:block;font-family:var(--body);font-size:10px;font-weight:400;opacity:.5}
  table.grid th.hr{position:sticky;left:0;z-index:1;top:auto;font-family:var(--body);font-size:10px;
    font-weight:600;opacity:.55;width:40px;text-align:right;padding-right:6px;border-bottom:none}
  table.grid td{padding:0;border:1px solid rgba(16,42,134,.07)}
  .cell{display:block;width:100%;height:16px;font-size:10px;font-weight:600;color:rgba(16,42,134,.8)}
  .cell.lv1{background:rgba(255,196,108,.35)}
  .cell.lv2{background:rgba(255,196,108,.6)}
  .cell.lv3{background:rgba(255,196,108,.85)}
  .cell.lv4{background:var(--bt-orange)}
  .mine .cell{height:20px}
  .mine .cell.on{background:var(--bt-navy)}

  /* ---------- 批次填寫 ---------- */
  /* 規格 §4-3 B：拖曳塗一百個格子在手機上不可行，已經實測過。
     所以這一塊排在格線**前面**，而且是預設看得到的那一塊。 */
  .batch{background:rgba(255,255,255,.45);border:1px solid rgba(16,42,134,.2);
    border-radius:2px;padding:14px 14px 10px;margin-bottom:14px}
  .brow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
  .brow i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.55;min-width:44px}
  .brow.copy{margin:16px 0 6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--display);font-size:16px;font-weight:600;min-width:38px;height:38px;
    border:1px solid rgba(16,42,134,.3);border-radius:2px;background:rgba(255,255,255,.6)}
  .chip.on{background:var(--bt-navy);color:var(--bt-cream);border-color:var(--bt-navy)}
  .row.sticky{position:sticky;bottom:0;background:var(--paper);padding:12px 0 4px;margin-top:12px;
    border-top:1px solid rgba(16,42,134,.15)}

  /* ---------- 成員清單 ---------- */
  table.who{width:100%;border-collapse:collapse;font-size:14px}
  table.who th{text-align:left;font-family:var(--display);font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;opacity:.55;padding:6px 8px;border-bottom:1px solid rgba(16,42,134,.2)}
  table.who td{padding:9px 8px;border-bottom:1px dotted rgba(16,42,134,.16)}
  table.who .team{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.5}
  /* 規格 §4-3 C 寫「超過 30 天標紅」，但硬規則是一個畫面最多三色（見 brand.css），
     而 check.sh 會擋。**沒有為了這一個畫面去放寬硬規則** —— 那條規則的價值就在
     它不能被單一個需求推翻。改用既有的橘色當底、文字說清楚是什麼狀況。
     顏色只是輔助：真正在講「該更新了」的是那一欄的字，色盲與黑白列印也讀得到。 */
  table.who tr.stale td{background:rgba(255,196,108,.3)}
  .warn{font-weight:700;text-decoration:underline;text-underline-offset:2px}

  /* ---------- 時區挑選 ---------- */
  .tzlist{display:grid;gap:6px;margin-top:6px}
  .tzitem{text-align:left;padding:10px 12px;border:1px solid rgba(16,42,134,.22);border-radius:2px;
    background:rgba(255,255,255,.5)}
  .tzitem b{display:block;font-family:var(--display);font-size:18px;font-weight:600}
  .tzitem span{font-size:11px;opacity:.55}

  /* ---------- 彈出 ---------- */
  .scrim{position:fixed;inset:0;background:rgba(16,42,134,.45);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:50;overflow:auto}
  .modal{background:var(--paper);border-radius:var(--r);padding:22px;max-width:520px;width:100%;
    border:1px solid rgba(16,42,134,.3);max-height:92vh;overflow:auto}
  .modal h3{font-family:var(--display);font-size:26px;font-weight:700;margin:0 0 2px}
  .modal .sub{font-size:13px;opacity:.6;margin-bottom:14px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .two i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
  .two ul{margin:6px 0 0;padding-left:18px;font-size:14px}
  .two ul.dim{opacity:.5}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div id="bt-root"><div class="empty">載入中…</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
